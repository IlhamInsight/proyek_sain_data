<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 430" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-title-crnn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="layer-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow-crnn" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="570" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="url(#grad-title-crnn)" letter-spacing="0.8">
    ARSITEKTUR MODEL TUNGGAL: ATTENTION-BASED CRNN
  </text>
  <text x="570" y="62" text-anchor="middle" font-size="12.5" fill="#94a3b8">
    2D-CNN Spasial-Spektral + 2-Layer Bi-LSTM Temporal + Multi-Head Self-Attention + Softmax 8 Kelas
  </text>

  <!-- Block 1: Input Tensor -->
  <g transform="translate(30, 90)" filter="url(#shadow-crnn)">
    <rect width="145" height="230" rx="10" fill="url(#layer-bg)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect width="145" height="36" rx="10" fill="#0284c7" fill-opacity="0.3"/>
    <text x="72" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#38bdf8">INPUT TENSOR</text>
    <text x="72" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">264 x 94</text>
    <text x="72" y="98" text-anchor="middle" font-size="10" fill="#94a3b8">264 Kanal Fitur</text>
    <text x="72" y="115" text-anchor="middle" font-size="10" fill="#94a3b8">94 Frame Waktu</text>
    <rect x="12" y="140" width="121" height="70" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="72" y="160" text-anchor="middle" font-size="9.5" fill="#7dd3fc">Log Mel (128)</text>
    <text x="72" y="177" text-anchor="middle" font-size="9.5" fill="#7dd3fc">MFCC+D+DD (120)</text>
    <text x="72" y="194" text-anchor="middle" font-size="9.5" fill="#7dd3fc">Chroma &amp; Stat (16)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="175" y1="205" x2="205" y2="205" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2"/>
  <polygon points="213,205 203,199 203,211" fill="#38bdf8"/>

  <!-- Block 2: 2D-CNN Backbone -->
  <g transform="translate(215, 90)" filter="url(#shadow-crnn)">
    <rect width="175" height="230" rx="10" fill="url(#layer-bg)" stroke="#818cf8" stroke-width="1.8"/>
    <rect width="175" height="36" rx="10" fill="#4f46e5" fill-opacity="0.3"/>
    <text x="87" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#a5b4fc">2D-CNN BACKBONE</text>
    <text x="87" y="65" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f8fafc">4 Blok Bertingkat</text>
    
    <rect x="12" y="80" width="151" height="32" rx="5" fill="#0f172a" stroke="#312e81" stroke-width="1"/>
    <text x="87" y="100" text-anchor="middle" font-size="10" fill="#c7d2fe">Conv2D (32 Filter, 3x3)</text>

    <rect x="12" y="118" width="151" height="32" rx="5" fill="#0f172a" stroke="#312e81" stroke-width="1"/>
    <text x="87" y="138" text-anchor="middle" font-size="10" fill="#c7d2fe">Conv2D (64 Filter, 3x3)</text>

    <rect x="12" y="156" width="151" height="32" rx="5" fill="#0f172a" stroke="#312e81" stroke-width="1"/>
    <text x="87" y="176" text-anchor="middle" font-size="10" fill="#c7d2fe">Conv2D (128 Filter, 3x3)</text>

    <rect x="12" y="194" width="151" height="32" rx="5" fill="#0f172a" stroke="#312e81" stroke-width="1"/>
    <text x="87" y="214" text-anchor="middle" font-size="10" fill="#c7d2fe">Conv2D (256 Filter, 3x3)</text>

    <text x="87" y="248" text-anchor="middle" font-size="9" fill="#94a3b8">+ BatchNorm, ELU, &amp; MaxPool</text>
    <text x="87" y="262" text-anchor="middle" font-size="9" fill="#818cf8">Ekstraksi Tekstur Spektrogram</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="390" y1="205" x2="420" y2="205" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4,2"/>
  <polygon points="428,205 418,199 418,211" fill="#818cf8"/>

  <!-- Block 3: Bi-LSTM Temporal -->
  <g transform="translate(430, 90)" filter="url(#shadow-crnn)">
    <rect width="175" height="230" rx="10" fill="url(#layer-bg)" stroke="#a855f7" stroke-width="1.8"/>
    <rect width="175" height="36" rx="10" fill="#7e22ce" fill-opacity="0.3"/>
    <text x="87" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#d8b4fe">2-LAYER BI-LSTM</text>
    <text x="87" y="65" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f8fafc">Konteks Temporal</text>

    <rect x="12" y="80" width="151" height="50" rx="6" fill="#0f172a" stroke="#581c87" stroke-width="1"/>
    <text x="87" y="101" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e9d5ff">Forward LSTM</text>
    <text x="87" y="118" text-anchor="middle" font-size="9.5" fill="#94a3b8">Awal ke Akhir Kalimat</text>

    <rect x="12" y="138" width="151" height="50" rx="6" fill="#0f172a" stroke="#581c87" stroke-width="1"/>
    <text x="87" y="159" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e9d5ff">Backward LSTM</text>
    <text x="87" y="176" text-anchor="middle" font-size="9.5" fill="#94a3b8">Akhir ke Awal Kalimat</text>

    <rect x="12" y="196" width="151" height="42" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
    <text x="87" y="214" text-anchor="middle" font-size="10" font-weight="600" fill="#f3e8ff">128 Hidden Units</text>
    <text x="87" y="228" text-anchor="middle" font-size="9" fill="#d8b4fe">Menangkap Dinamika Prosodi</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="605" y1="205" x2="635" y2="205" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,2"/>
  <polygon points="643,205 633,199 633,211" fill="#a855f7"/>

  <!-- Block 4: Multi-Head Self-Attention -->
  <g transform="translate(645, 90)" filter="url(#shadow-crnn)">
    <rect width="185" height="230" rx="10" fill="url(#layer-bg)" stroke="#ec4899" stroke-width="1.8"/>
    <rect width="185" height="36" rx="10" fill="#be185d" fill-opacity="0.3"/>
    <text x="92" y="24" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#f472b6">SELF-ATTENTION</text>
    <text x="92" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#f8fafc">Penyorotan Emosional</text>

    <rect x="12" y="80" width="161" height="55" rx="6" fill="#0f172a" stroke="#831843" stroke-width="1"/>
    <text x="92" y="101" text-anchor="middle" font-size="10" font-weight="600" fill="#fbcfe8">Scaled Dot-Product</text>
    <text x="92" y="117" text-anchor="middle" font-size="9" fill="#f472b6">Softmax(QK^T / sqrt(d)) * V</text>
    <text x="92" y="129" text-anchor="middle" font-size="8.5" fill="#94a3b8">4 Atensi Paralel (Heads)</text>

    <rect x="12" y="145" width="161" height="50" rx="6" fill="#500724" stroke="#ec4899" stroke-width="1"/>
    <text x="92" y="165" text-anchor="middle" font-size="10" font-weight="600" fill="#fce7f3">Fokus Suku Kata Kritis</text>
    <text x="92" y="181" text-anchor="middle" font-size="9" fill="#fbcfe8">Menekan jeda/hening,</text>
    <text x="92" y="192" text-anchor="middle" font-size="9" fill="#fbcfe8">mengangkat puncak emosi</text>

    <text x="92" y="218" text-anchor="middle" font-size="9.5" fill="#f472b6">Global Attention Pooling</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="830" y1="205" x2="860" y2="205" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="4,2"/>
  <polygon points="868,205 858,199 858,211" fill="#ec4899"/>

  <!-- Block 5: Classifier Head -->
  <g transform="translate(870, 90)" filter="url(#shadow-crnn)">
    <rect width="240" height="230" rx="10" fill="url(#layer-bg)" stroke="#10b981" stroke-width="1.8"/>
    <rect width="240" height="36" rx="10" fill="#059669" fill-opacity="0.3"/>
    <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">SOFTMAX CLASSIFIER</text>
    
    <rect x="12" y="50" width="216" height="40" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1"/>
    <text x="120" y="68" text-anchor="middle" font-size="10.5" font-weight="600" fill="#a7f3d0">Dense Layer (128 Units, ELU)</text>
    <text x="120" y="83" text-anchor="middle" font-size="9" fill="#94a3b8">+ BatchNorm1D &amp; Dropout 0.3</text>

    <rect x="12" y="98" width="216" height="118" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#f8fafc">8 KELAS EMOSI DISKRIT</text>
    <text x="24" y="137" font-size="9.5" fill="#d1fae5">1. Neutral</text>
    <text x="128" y="137" font-size="9.5" fill="#d1fae5">5. Angry</text>
    <text x="24" y="154" font-size="9.5" fill="#d1fae5">2. Calm</text>
    <text x="128" y="154" font-size="9.5" fill="#d1fae5">6. Fearful</text>
    <text x="24" y="171" font-size="9.5" fill="#d1fae5">3. Happy</text>
    <text x="128" y="171" font-size="9.5" fill="#d1fae5">7. Disgust</text>
    <text x="24" y="188" font-size="9.5" fill="#d1fae5">4. Sad</text>
    <text x="128" y="188" font-size="9.5" fill="#d1fae5">8. Surprised</text>
    <text x="120" y="208" text-anchor="middle" font-size="9" font-weight="600" fill="#6ee7b7">Distribusi Probabilitas Terkalibrasi</text>
  </g>

  <!-- Bottom Annotation Bar -->
  <g transform="translate(30, 345)" filter="url(#shadow-crnn)">
    <rect width="1080" height="60" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2"/>
    <text x="540" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">
      OPTIMASI HIPERPARAMETER OTOMATIS: BAYESIAN OPTIMIZATION (OPTUNA TPE - 30 TRIALS)
    </text>
    <text x="540" y="44" text-anchor="middle" font-size="10.5" fill="#94a3b8">
      Tuning Otomatis Learning Rate, Weight Decay, CNN Base Filters, Hidden Units, Dropout, dan Head Atensi
    </text>
  </g>
</svg>

