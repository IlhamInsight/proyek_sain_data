<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-p1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="570" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="url(#grad-title)" letter-spacing="0.8">
    EMPAT PILAR TEORI PSIKOLOGI DALAM AFFECTIVE COMPUTING SUARA
  </text>
  <text x="570" y="62" text-anchor="middle" font-size="12.5" fill="#94a3b8">
    Fondasi Ilmiah Pemetaan Sinyal Akustik Wicara ke Dimensi Afektif Manusia
  </text>

  <!-- ==================== 4 PILLARS (ROW 1) ==================== -->

  <!-- Pillar 1: Paul Ekman -->
  <g transform="translate(30, 85)" filter="url(#shadow)">
    <rect width="255" height="260" rx="12" fill="url(#card-p1)" stroke="#38bdf8" stroke-width="2"/>
    <rect width="255" height="42" rx="12" fill="#0284c7" fill-opacity="0.25"/>
    <circle cx="24" cy="21" r="12" fill="#0284c7"/>
    <text x="24" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
    <text x="44" y="26" font-size="13" font-weight="bold" fill="#38bdf8">Teori Emosi Diskrit</text>

    <text x="18" y="64" font-size="12" font-weight="700" fill="#f8fafc">Paul Ekman (Universalitas)</text>
    <text x="18" y="82" font-size="10.5" fill="#94a3b8">• 8 Kategori Emosi Universal</text>
    <text x="18" y="98" font-size="10.5" fill="#94a3b8">• Neutral, Calm, Happy, Sad</text>
    <text x="18" y="114" font-size="10.5" fill="#94a3b8">• Angry, Fearful, Disgust, Surprised</text>
    
    <rect x="14" y="132" width="227" height="48" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="22" y="150" font-size="10.5" font-weight="600" fill="#7dd3fc">Penerapan pada Model:</text>
    <text x="22" y="168" font-size="10" fill="#bae6fd">Menentukan 8 target kelas diskrit</text>

    <rect x="14" y="190" width="227" height="56" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="22" y="208" font-size="10" font-weight="600" fill="#38bdf8">Karakteristik Kunci:</text>
    <text x="22" y="224" font-size="9.5" fill="#94a3b8">Batas keputusan kategoris</text>
    <text x="22" y="238" font-size="9.5" fill="#94a3b8">pada lapisan akhir Softmax</text>
  </g>

  <!-- Pillar 2: James Russell -->
  <g transform="translate(305, 85)" filter="url(#shadow)">
    <rect width="255" height="260" rx="12" fill="url(#card-p1)" stroke="#818cf8" stroke-width="2"/>
    <rect width="255" height="42" rx="12" fill="#4f46e5" fill-opacity="0.25"/>
    <circle cx="24" cy="21" r="12" fill="#4f46e5"/>
    <text x="24" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
    <text x="44" y="26" font-size="13" font-weight="bold" fill="#a5b4fc">Dimensi Sirkumpleks</text>

    <text x="18" y="64" font-size="12" font-weight="700" fill="#f8fafc">James Russell (2 Sumbu)</text>
    <text x="18" y="82" font-size="10.5" fill="#94a3b8">• Sumbu Arousal (Aktivasi):</text>
    <text x="26" y="98" font-size="10" fill="#cbd5e1">Energi suara, RMSE, F0, ZCR</text>
    <text x="18" y="116" font-size="10.5" fill="#94a3b8">• Sumbu Valence (Positif/Negatif):</text>
    <text x="26" y="132" font-size="10" fill="#cbd5e1">Formants, Mel-Tilt, Chroma</text>

    <rect x="14" y="146" width="227" height="48" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="22" y="164" font-size="10.5" font-weight="600" fill="#c7d2fe">Penerapan pada Fitur:</text>
    <text x="22" y="182" font-size="10" fill="#e0e7ff">Pemetaan 264 kanal multi-domain</text>

    <rect x="14" y="202" width="227" height="44" rx="6" fill="#0f172a" stroke="#312e81" stroke-width="1"/>
    <text x="22" y="219" font-size="9.5" font-weight="600" fill="#818cf8">Visualisasi 2D Scatter:</text>
    <text x="22" y="234" font-size="9.5" fill="#94a3b8">Koordinat afektif saat deployment</text>
  </g>

  <!-- Pillar 3: ANS & Larynx Physiology -->
  <g transform="translate(580, 85)" filter="url(#shadow)">
    <rect width="255" height="260" rx="12" fill="url(#card-p1)" stroke="#10b981" stroke-width="2"/>
    <rect width="255" height="42" rx="12" fill="#059669" fill-opacity="0.25"/>
    <circle cx="24" cy="21" r="12" fill="#059669"/>
    <text x="24" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
    <text x="44" y="26" font-size="13" font-weight="bold" fill="#34d399">Psikofisiologi Saraf (ANS)</text>

    <text x="18" y="64" font-size="12" font-weight="700" fill="#f8fafc">Sistem Saraf Otonom &amp; Vokal</text>
    <text x="18" y="82" font-size="10.5" fill="#94a3b8">• Saraf Simpatis (Fight/Flight):</text>
    <text x="26" y="98" font-size="10" fill="#cbd5e1">Pita suara tegang, laju cepat</text>
    <text x="18" y="116" font-size="10.5" fill="#94a3b8">• Saraf Parasimpatis (Relaks):</text>
    <text x="26" y="132" font-size="10" fill="#cbd5e1">Pita suara kendur, desah napas</text>

    <rect x="14" y="146" width="227" height="48" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="22" y="164" font-size="10.5" font-weight="600" fill="#a7f3d0">Penerapan pada Rekayasa Fitur:</text>
    <text x="22" y="182" font-size="10" fill="#d1fae5">Delta (Kecepatan) &amp; Delta-Delta (Sentakan)</text>

    <rect x="14" y="202" width="227" height="44" rx="6" fill="#0f172a" stroke="#065f46" stroke-width="1"/>
    <text x="22" y="219" font-size="9.5" font-weight="600" fill="#34d399">Parameter Fisik Kunci:</text>
    <text x="22" y="234" font-size="9.5" fill="#94a3b8">ZCR (desis) &amp; Spectral Rolloff 85%</text>
  </g>

  <!-- Pillar 4: Psychometric Validation -->
  <g transform="translate(855, 85)" filter="url(#shadow)">
    <rect width="255" height="260" rx="12" fill="url(#card-p1)" stroke="#f59e0b" stroke-width="2"/>
    <rect width="255" height="42" rx="12" fill="#d97706" fill-opacity="0.25"/>
    <circle cx="24" cy="21" r="12" fill="#d97706"/>
    <text x="24" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
    <text x="44" y="26" font-size="13" font-weight="bold" fill="#fbbf24">Validasi Psikometri</text>

    <text x="18" y="64" font-size="12" font-weight="700" fill="#f8fafc">Livingstone &amp; Russo (2018)</text>
    <text x="18" y="82" font-size="10.5" fill="#94a3b8">• 247 Penilai Manusia Independen</text>
    <text x="18" y="98" font-size="10.5" fill="#94a3b8">• Uji Reliabilitas Psikometri</text>
    <text x="18" y="114" font-size="10.5" fill="#94a3b8">• Kesepakatan Inter-Rater Tinggi</text>

    <rect x="14" y="132" width="227" height="48" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="22" y="150" font-size="10.5" font-weight="600" fill="#fde68a">Jaminan Ilmiah Ground Truth:</text>
    <text x="22" y="168" font-size="10" fill="#fef3c7">Label data bebas dari bias subjektif</text>

    <rect x="14" y="190" width="227" height="56" rx="6" fill="#0f172a" stroke="#78350f" stroke-width="1"/>
    <text x="22" y="208" font-size="10" font-weight="600" fill="#fbbf24">Tolok Ukur Evaluasi:</text>
    <text x="22" y="224" font-size="9.5" fill="#94a3b8">Validasi persepsi psikometri</text>
    <text x="22" y="238" font-size="9.5" fill="#94a3b8">sebelum pelatihan model</text>
  </g>

  <!-- ==================== INTEGRATION FOOTER ==================== -->
  <g transform="translate(30, 365)" filter="url(#shadow)">
    <rect width="1080" height="110" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    
    <text x="540" y="28" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">
      INTEGRASI KE DALAM ARSITEKTUR SPEECH EMOTION RECOGNITION
    </text>

    <!-- 4 Sub-Integration Badges -->
    <rect x="25" y="44" width="245" height="52" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="147" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">Target Klasifikasi</text>
    <text x="147" y="83" text-anchor="middle" font-size="10" fill="#94a3b8">8 Kelas Emosi Diskrit Ekman</text>

    <rect x="290" y="44" width="245" height="52" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <text x="412" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#818cf8">Rekayasa Fitur 264 Kanal</text>
    <text x="412" y="83" text-anchor="middle" font-size="10" fill="#94a3b8">Dinamika Sumbu Arousal &amp; Valence</text>

    <rect x="555" y="44" width="245" height="52" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="677" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Indikator Laring &amp; Paru</text>
    <text x="677" y="83" text-anchor="middle" font-size="10" fill="#94a3b8">MFCC Dinamis, RMSE, &amp; ZCR</text>

    <rect x="820" y="44" width="245" height="52" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="942" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">Verifikasi Kualitas Data</text>
    <text x="942" y="83" text-anchor="middle" font-size="10" fill="#94a3b8">0% Noise Label (Uji 247 Rater)</text>
  </g>
</svg>

