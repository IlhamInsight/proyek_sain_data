<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 730" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Main Title -->
  <text x="570" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="url(#grad-title)" letter-spacing="0.8">
    ARSITEKTUR END-TO-END 6 TAHAPAN SPEECH EMOTION RECOGNITION (CRISP-DM)
  </text>
  <text x="570" y="64" text-anchor="middle" font-size="13" fill="#94a3b8">
    Paradigma Affective Computing Terpadu: Attention-CRNN Tunggal &amp; Dual-Artifact Storage Efisien
  </text>

  <!-- ==================== ROW 1: TAHAP 1, 2, 3 ==================== -->

  <!-- STAGE 1: BUSINESS & DATA UNDERSTANDING -->
  <g transform="translate(30, 88)" filter="url(#shadow)">
    <rect width="330" height="274" rx="12" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="2"/>
    <rect width="330" height="42" rx="12" fill="#0284c7" fill-opacity="0.3"/>
    <circle cx="28" cy="21" r="13" fill="#0284c7"/>
    <text x="28" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
    <text x="52" y="26" font-size="13.5" font-weight="bold" fill="#38bdf8">BUSINESS &amp; DATA UNDERSTANDING</text>

    <!-- Sub-boxes -->
    <rect x="16" y="54" width="298" height="44" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="28" y="73" font-size="11.5" font-weight="600" fill="#f8fafc">Fondasi Teori Affective Computing</text>
    <text x="28" y="90" font-size="10.5" fill="#94a3b8">Ekman 8 Emosi Diskrit &amp; Model Sirkumpleks Russell</text>

    <rect x="16" y="106" width="298" height="44" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="28" y="125" font-size="11.5" font-weight="600" fill="#f8fafc">Audit Dataset RAVDESS &amp; Fisiologi</text>
    <text x="28" y="142" font-size="10.5" fill="#94a3b8">1.440 Audio Studio (24 Aktor) &amp; Validasi 247 Raters</text>

    <rect x="16" y="158" width="298" height="44" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="28" y="177" font-size="11.5" font-weight="600" fill="#f8fafc">Analisis Ketimpangan &amp; Karakteristik</text>
    <text x="28" y="194" font-size="10.5" fill="#94a3b8">Minoritas Neutral (96 vs 192) &amp; Invarian Leksikal</text>

    <rect x="16" y="214" width="298" height="44" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="165" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">Output: 1.440 Metadata Katalog Terstruktur</text>
    <text x="165" y="249" text-anchor="middle" font-size="10" fill="#38bdf8">&amp; Baseline Psikometri Tervalidasi</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="360" y1="225" x2="395" y2="225" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5,3"/>
  <polygon points="403,225 391,218 391,232" fill="#38bdf8"/>

  <!-- STAGE 2: DATA PREPARATION & BALANCING -->
  <g transform="translate(405, 88)" filter="url(#shadow)">
    <rect width="330" height="274" rx="12" fill="url(#card-bg)" stroke="#06b6d4" stroke-width="2"/>
    <rect width="330" height="42" rx="12" fill="#0891b2" fill-opacity="0.3"/>
    <circle cx="28" cy="21" r="13" fill="#0891b2"/>
    <text x="28" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
    <text x="52" y="26" font-size="13.5" font-weight="bold" fill="#22d3ee">DATA PREPARATION &amp; BALANCING</text>

    <!-- Sub-boxes -->
    <rect x="16" y="54" width="298" height="44" rx="6" fill="#0f172a" stroke="#164e63" stroke-width="1.2"/>
    <text x="28" y="73" font-size="11.5" font-weight="600" fill="#f8fafc">Standardisasi &amp; Pembersihan Sinyal</text>
    <text x="28" y="90" font-size="10.5" fill="#94a3b8">Mono 16 kHz, Trim 25dB, Pre-Emphasis 0.97, Fix 3.0s</text>

    <rect x="16" y="106" width="298" height="44" rx="6" fill="#0f172a" stroke="#164e63" stroke-width="1.2"/>
    <text x="28" y="125" font-size="11.5" font-weight="600" fill="#f8fafc">Partisi Bebas Kebocoran (0% Leakage)</text>
    <text x="28" y="142" font-size="10.5" fill="#94a3b8">Speaker-Independent Split: Train(18), Val(2), Test(4)</text>

    <rect x="16" y="158" width="298" height="44" rx="6" fill="#0f172a" stroke="#164e63" stroke-width="1.2"/>
    <text x="28" y="177" font-size="11.5" font-weight="600" fill="#f8fafc">Hybrid Balancing &amp; Efisiensi File</text>
    <text x="28" y="194" font-size="10.5" fill="#94a3b8">4x Aug Neutral + 2x Others (288/kelas) + Utterance-CMVN</text>

    <rect x="16" y="214" width="298" height="44" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
    <text x="165" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#67e8f9">Output: Dual-Artifact Terpadu Bebas Redundansi</text>
    <text x="165" y="249" text-anchor="middle" font-size="10" fill="#22d3ee">Array NPZ Terkompresi &amp; CSV 528 Fitur Siap Pakai</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="735" y1="225" x2="770" y2="225" stroke="#06b6d4" stroke-width="3" stroke-dasharray="5,3"/>
  <polygon points="778,225 766,218 766,232" fill="#06b6d4"/>

  <!-- STAGE 3: ACOUSTIC FEATURE EXTRACTION -->
  <g transform="translate(780, 88)" filter="url(#shadow)">
    <rect width="330" height="274" rx="12" fill="url(#card-bg)" stroke="#10b981" stroke-width="2"/>
    <rect width="330" height="42" rx="12" fill="#059669" fill-opacity="0.3"/>
    <circle cx="28" cy="21" r="13" fill="#059669"/>
    <text x="28" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
    <text x="52" y="26" font-size="13.5" font-weight="bold" fill="#34d399">ACOUSTIC FEATURE EXTRACTION</text>

    <!-- Sub-boxes -->
    <rect x="16" y="54" width="298" height="44" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1.2"/>
    <text x="28" y="73" font-size="11.5" font-weight="600" fill="#f8fafc">Log Mel &amp; MFCC + Delta + Delta-Delta</text>
    <text x="28" y="90" font-size="10.5" fill="#94a3b8">128 Mel Bins + 120 MFCC Dinamis (Timbre &amp; Formant)</text>

    <rect x="16" y="106" width="298" height="44" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1.2"/>
    <text x="28" y="125" font-size="11.5" font-weight="600" fill="#f8fafc">Chroma &amp; Fitur Fisiologis Spektral</text>
    <text x="28" y="142" font-size="10.5" fill="#94a3b8">12 Pitch Classes + RMSE, ZCR, Centroid, Rolloff</text>

    <rect x="16" y="158" width="298" height="44" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1.2"/>
    <text x="28" y="177" font-size="11.5" font-weight="600" fill="#f8fafc">Sinkronisasi Tensor &amp; Normalisasi Z-Score</text>
    <text x="28" y="194" font-size="10.5" fill="#94a3b8">T=94 Frame Sinkron, Zero-Jitter, Z-Score Tanpa Kebocoran</text>

    <rect x="16" y="214" width="298" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="165" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#a7f3d0">Output: Tensor 264 Kanal x 94 Frame</text>
    <text x="165" y="249" text-anchor="middle" font-size="10" fill="#34d399">&amp; 528 Fitur Statistik Agregat (Mean &amp; Std)</text>
  </g>

  <!-- Connector Arrow from Stage 3 (Row 1 Right) to Stage 4 (Row 2 Left) -->
  <path d="M 945 362 L 945 388 L 195 388 L 195 410" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="195,418 188,406 202,406" fill="#818cf8"/>

  <!-- ==================== ROW 2: TAHAP 4, 5, 6 ==================== -->

  <!-- STAGE 4: DEEP LEARNING MODELING & TUNING -->
  <g transform="translate(30, 420)" filter="url(#shadow)">
    <rect width="330" height="274" rx="12" fill="url(#card-bg)" stroke="#818cf8" stroke-width="2"/>
    <rect width="330" height="42" rx="12" fill="#4f46e5" fill-opacity="0.3"/>
    <circle cx="28" cy="21" r="13" fill="#4f46e5"/>
    <text x="28" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
    <text x="52" y="26" font-size="13.5" font-weight="bold" fill="#a5b4fc">DEEP LEARNING MODELING</text>

    <!-- Sub-boxes -->
    <rect x="16" y="54" width="298" height="44" rx="6" fill="#0f172a" stroke="#312e81" stroke-width="1.2"/>
    <text x="28" y="73" font-size="11.5" font-weight="600" fill="#f8fafc">2D-CNN Spasial-Spektral Backbone</text>
    <text x="28" y="90" font-size="10.5" fill="#94a3b8">4 Blok Conv2D Bertingkat (32-256 Filter) + BatchNorm</text>

    <rect x="16" y="106" width="298" height="44" rx="6" fill="#0f172a" stroke="#312e81" stroke-width="1.2"/>
    <text x="28" y="125" font-size="11.5" font-weight="600" fill="#f8fafc">Bi-LSTM &amp; Multi-Head Self-Attention</text>
    <text x="28" y="142" font-size="10.5" fill="#94a3b8">Konteks Maju-Mundur &amp; Penyorotan Puncak Emosional</text>

    <rect x="16" y="158" width="298" height="44" rx="6" fill="#0f172a" stroke="#312e81" stroke-width="1.2"/>
    <text x="28" y="177" font-size="11.5" font-weight="600" fill="#f8fafc">Optimasi Bayesian (Optuna TPE)</text>
    <text x="28" y="194" font-size="10.5" fill="#94a3b8">Tuning Otomatis LR, Dropout, Hidden Dim, Attention</text>

    <rect x="16" y="214" width="298" height="44" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="165" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#c7d2fe">Output: Model Tunggal Attention-CRNN</text>
    <text x="165" y="249" text-anchor="middle" font-size="10" fill="#818cf8">&amp; Checkpoint Bobot Optimal</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="360" y1="557" x2="395" y2="557" stroke="#818cf8" stroke-width="3" stroke-dasharray="5,3"/>
  <polygon points="403,557 391,550 391,564" fill="#818cf8"/>

  <!-- STAGE 5: EVALUATION & VALIDATION -->
  <g transform="translate(405, 420)" filter="url(#shadow)">
    <rect width="330" height="274" rx="12" fill="url(#card-bg)" stroke="#f59e0b" stroke-width="2"/>
    <rect width="330" height="42" rx="12" fill="#d97706" fill-opacity="0.3"/>
    <circle cx="28" cy="21" r="13" fill="#d97706"/>
    <text x="28" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
    <text x="52" y="26" font-size="13.5" font-weight="bold" fill="#fcd34d">EVALUATION &amp; VALIDATION</text>

    <!-- Sub-boxes -->
    <rect x="16" y="54" width="298" height="44" rx="6" fill="#0f172a" stroke="#78350f" stroke-width="1.2"/>
    <text x="28" y="73" font-size="11.5" font-weight="600" fill="#f8fafc">Validasi Silang Bebas Kebocoran</text>
    <text x="28" y="90" font-size="10.5" fill="#94a3b8">5-Fold GroupKFold by Actor ID &amp; Uji Test Set Terpisah</text>

    <rect x="16" y="106" width="298" height="44" rx="6" fill="#0f172a" stroke="#78350f" stroke-width="1.2"/>
    <text x="28" y="125" font-size="11.5" font-weight="600" fill="#f8fafc">Metrik Sains Data &amp; Psikometri</text>
    <text x="28" y="142" font-size="10.5" fill="#94a3b8">Akurasi (WAR) >= 85%, UAR >= 84%, F1 Macro, Cohen's Kappa</text>

    <rect x="16" y="158" width="298" height="44" rx="6" fill="#0f172a" stroke="#78350f" stroke-width="1.2"/>
    <text x="28" y="177" font-size="11.5" font-weight="600" fill="#f8fafc">Audit Keadilan &amp; Pasangan Kebingungan</text>
    <text x="28" y="194" font-size="10.5" fill="#94a3b8">Paritas Gender (Pria vs Wanita) &amp; Confusion Matrix 8x8</text>

    <rect x="16" y="214" width="298" height="44" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="165" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#fde68a">Output: Laporan Komparasi Kinerja</text>
    <text x="165" y="249" text-anchor="middle" font-size="10" fill="#f59e0b">&amp; Matriks Diagnostik Ilmiah Terverifikasi</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="735" y1="557" x2="770" y2="557" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5,3"/>
  <polygon points="778,557 766,550 766,564" fill="#f59e0b"/>

  <!-- STAGE 6: DEPLOYMENT & 2-MODE SERVING -->
  <g transform="translate(780, 420)" filter="url(#shadow)">
    <rect width="330" height="274" rx="12" fill="url(#card-bg)" stroke="#ec4899" stroke-width="2"/>
    <rect width="330" height="42" rx="12" fill="#db2777" fill-opacity="0.3"/>
    <circle cx="28" cy="21" r="13" fill="#db2777"/>
    <text x="28" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
    <text x="52" y="26" font-size="13.5" font-weight="bold" fill="#f472b6">DEPLOYMENT &amp; 2-MODE SERVING</text>

    <!-- Sub-boxes -->
    <rect x="16" y="54" width="298" height="44" rx="6" fill="#0f172a" stroke="#831843" stroke-width="1.2"/>
    <text x="28" y="73" font-size="11.5" font-weight="600" fill="#f8fafc">Mode 1: Pengujian Test Set Dataset</text>
    <text x="28" y="90" font-size="10.5" fill="#94a3b8">240 File Aktor Baru (Actor 21-24) untuk Benchmark Ilmiah</text>

    <rect x="16" y="106" width="298" height="44" rx="6" fill="#0f172a" stroke="#831843" stroke-width="1.2"/>
    <text x="28" y="125" font-size="11.5" font-weight="600" fill="#f8fafc">Mode 2: Audio Klip Film &amp; Live Mic</text>
    <text x="28" y="142" font-size="10.5" fill="#94a3b8">Dialog Adegan Film Dramatis + Kalibrasi Utterance-CMVN</text>

    <rect x="16" y="158" width="298" height="44" rx="6" fill="#0f172a" stroke="#831843" stroke-width="1.2"/>
    <text x="28" y="177" font-size="11.5" font-weight="600" fill="#f8fafc">Dashboard Web &amp; REST API FP16</text>
    <text x="28" y="194" font-size="10.5" fill="#94a3b8">Peta 2D Russell (Arousal-Valence) &amp; Latensi &lt; 30 ms</text>

    <rect x="16" y="214" width="298" height="44" rx="6" fill="#500724" stroke="#ec4899" stroke-width="1"/>
    <text x="165" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#fbcfe8">Output: Aplikasi Komputasi Afektif Interaktif</text>
    <text x="165" y="249" text-anchor="middle" font-size="10" fill="#f472b6">&amp; Endpoint REST API Siap Produksi</text>
  </g>
</svg>
