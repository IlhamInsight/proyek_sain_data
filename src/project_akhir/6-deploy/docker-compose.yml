version: "3.8"

services:
  ser-fastapi-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ser-emotion-classifier
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

